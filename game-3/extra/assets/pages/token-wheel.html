<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="cybergame-common.css">
<style>
  html, body { background: transparent; overflow: hidden; }
  .container { justify-content: center; align-items: center; }
  .branded-panel {
    background: rgba(6, 10, 20, 0.88);
    border: 1px solid rgba(0, 212, 255, 0.45);
    border-radius: 8px;
    padding: 18px 28px;
    box-shadow: 0 0 24px rgba(0,212,255,0.15);
    display: flex; flex-direction: column; align-items: center;
    gap: 14px; max-width: 940px; width: 96%;
  }
  .title { font-size: 20px; color: #00d4ff; text-transform: uppercase; letter-spacing: 3px; }
  .subtitle { font-size: 13px; color: rgba(224,230,240,0.65); text-align: center; }

  .wheel-row { display: flex; gap: 32px; align-items: center; width: 100%; justify-content: center; }
  .wheel {
    width: 300px; height: 300px; position: relative;
    flex-shrink: 0;
  }
  .wheel svg { width: 100%; height: 100%; display: block; }

  .seg-path {
    cursor: pointer;
    transition: filter 0.2s ease, stroke-width 0.2s ease;
  }
  .seg-path:hover { filter: brightness(1.4); }
  .seg-path:focus { outline: none; stroke-width: 1.4; }
  .seg-path.visited { stroke-width: 1.6; filter: brightness(1.25) saturate(1.5); }

  @keyframes seg-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
  .seg-path:not(.visited) { animation: seg-pulse 2.2s ease-in-out infinite; }
  .seg-path:hover, .seg-path:focus, .seg-path.visited { animation: none; }

  .seg-label {
    font-size: 4.2px; fill: #e0e6f0;
    text-anchor: middle; font-family: 'Courier New', monospace;
    letter-spacing: 0.4px; pointer-events: none;
    text-transform: uppercase;
  }
  .seg-group.visited .seg-label { fill: #39ff14; font-weight: bold; }

  .check-mark { opacity: 0; transition: opacity 0.35s ease; pointer-events: none; }
  .seg-group.visited .check-mark { opacity: 1; }

  .detail {
    flex: 1; max-width: 420px; min-height: 200px;
    padding: 16px; border-radius: 8px;
    background: rgba(0,0,0,0.45); border: 1px solid rgba(0,212,255,0.3);
    color: #e0e6f0; font-size: 13px; line-height: 1.55;
  }
  .detail .seg-name { color: #00d4ff; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .detail .empty { color: rgba(224,230,240,0.5); font-style: italic; }

  .progress-text { font-size: 13px; color: rgba(224,230,240,0.55); }
  .continue-btn { opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
  .continue-btn.visible { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>
<div class="container">
  <div class="branded-panel">
    <div class="title">Token Lifecycle</div>
    <div class="subtitle">Click each segment to read its role. All three must be visited before continuing to the Response Sequencer.</div>

    <div class="wheel-row">
      <div class="wheel" id="wheel" role="group" aria-label="Token lifecycle wheel — click each segment">
        <svg viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="48" fill="rgba(0,212,255,0.04)" stroke="#00d4ff" stroke-width="0.4"/>

          <!-- Issued (top-right wedge) -->
          <g class="seg-group" data-id="issued">
            <path class="seg-path" data-id="issued" tabindex="0" role="button" aria-label="Issued segment — click to read"
                  d="M 50 50 L 50 2 A 48 48 0 0 1 91.57 73.78 Z"
                  fill="rgba(0,212,255,0.18)" stroke="#00d4ff" stroke-width="0.5"/>
            <text class="seg-label" x="72" y="38">Issued</text>
            <g class="check-mark" transform="translate(72, 44)">
              <circle r="3.2" fill="#39ff14"/>
              <path d="M -1.4 0 L -0.3 1.3 L 1.7 -1.3" stroke="#06101a" stroke-width="0.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
          </g>

          <!-- Used (bottom wedge) -->
          <g class="seg-group" data-id="used">
            <path class="seg-path" data-id="used" tabindex="0" role="button" aria-label="Used segment — click to read"
                  d="M 50 50 L 91.57 73.78 A 48 48 0 0 1 8.43 73.78 Z"
                  fill="rgba(57,255,20,0.18)" stroke="#39ff14" stroke-width="0.5"/>
            <text class="seg-label" x="50" y="78">Used</text>
            <g class="check-mark" transform="translate(50, 84)">
              <circle r="3.2" fill="#39ff14"/>
              <path d="M -1.4 0 L -0.3 1.3 L 1.7 -1.3" stroke="#06101a" stroke-width="0.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
          </g>

          <!-- Expired / Revoked (top-left wedge) -->
          <g class="seg-group" data-id="revoked">
            <path class="seg-path" data-id="revoked" tabindex="0" role="button" aria-label="Expired or Revoked segment — click to read"
                  d="M 50 50 L 8.43 73.78 A 48 48 0 0 1 50 2 Z"
                  fill="rgba(255,170,60,0.18)" stroke="#ffaa3c" stroke-width="0.5"/>
            <text class="seg-label" x="28" y="38">Revoked</text>
            <g class="check-mark" transform="translate(28, 44)">
              <circle r="3.2" fill="#39ff14"/>
              <path d="M -1.4 0 L -0.3 1.3 L 1.7 -1.3" stroke="#06101a" stroke-width="0.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
          </g>

        </svg>
      </div>

      <div class="detail" id="detail" aria-live="polite">
        <span class="empty">Select a segment to read its role.</span>
      </div>
    </div>

    <div class="progress-text" id="progressText">0 / 3 segments visited</div>
    <button class="btn btn-success continue-btn" id="continueBtn">Proceed to Response Sequencer</button>
  </div>
</div>
<script>
const segs = {
  issued: {
    name: "Issued",
    text: "A new token is created by the server when a user authenticates. It encodes who the user is and how long the session is valid."
  },
  used: {
    name: "Used",
    text: "The client presents the token on each request. The server validates it and grants access. Tokens reduce password exposure — but they are now the credential."
  },
  revoked: {
    name: "Expired / Revoked",
    text: "When a token's lifetime ends or a breach is suspected, it is revoked. Rotation prevents reuse: even if an attacker captured an old token, the server no longer accepts it."
  }
};
const detailEl = document.getElementById("detail");
const progressText = document.getElementById("progressText");
const continueBtn = document.getElementById("continueBtn");
const visited = new Set();
let done = false;

document.querySelectorAll(".wheel .seg-path").forEach(p => {
  p.addEventListener("click", () => select(p.dataset.id, p));
  p.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(p.dataset.id, p); } });
});

function select(id, p) {
  visited.add(id);
  p.classList.add("visited");
  const group = p.closest(".seg-group");
  if (group) group.classList.add("visited");
  const s = segs[id];
  detailEl.innerHTML = `<div class="seg-name">${s.name}</div>${s.text}`;
  progressText.textContent = `${visited.size} / 3 segments visited`;
  if (visited.size === 3) {
    continueBtn.classList.add("visible");
    continueBtn.focus();
  }
}

continueBtn.addEventListener("click", () => {
  if (done) return; done = true;
  try { window.parent.postMessage({ type: "renjs-event", id: "token-wheel-complete" }, "*"); } catch(e) {}
});

window.addEventListener("load", () => window.focus());
</script>
</body>
</html>
