<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="cybergame-common.css">
<style>
  html, body { background: transparent; overflow: hidden; }
  .container { justify-content: center; align-items: center; }
  .branded-panel {
    background: rgba(6, 10, 20, 0.88);
    border: 1px solid rgba(255, 77, 109, 0.45);
    border-radius: 8px;
    padding: 24px 36px;
    box-shadow: 0 0 24px rgba(255, 77, 109, 0.15), inset 0 0 24px rgba(255, 77, 109, 0.03);
    display: flex; flex-direction: column; align-items: center;
    gap: 16px; max-width: 580px; width: 95%;
  }
  .title { font-size: 22px; color: #ff4d6d; text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 0 12px rgba(255, 77, 109, 0.5); }
  .subtitle { font-size: 13px; color: rgba(224,230,240,0.6); text-align: center; }
  .beacon-wrap { position: relative; width: 160px; height: 160px; display: flex; align-items: center; justify-content: center; }
  .beacon-ring {
    position: absolute; border: 3px solid #ff4d6d; border-radius: 50%;
    width: 100%; height: 100%; opacity: 0;
    animation: pulse-ring 1.6s ease-out infinite;
  }
  .beacon-ring:nth-child(2) { animation-delay: 0.5s; }
  .beacon-ring:nth-child(3) { animation-delay: 1.0s; }
  @keyframes pulse-ring {
    0%   { opacity: 0.9; transform: scale(0.4); }
    100% { opacity: 0; transform: scale(1.3); }
  }
  .beacon-core {
    position: relative; z-index: 2; width: 80px; height: 80px;
    border-radius: 50%; cursor: pointer;
    background: radial-gradient(circle, #ff4d6d 0%, #6a0d20 70%);
    box-shadow: 0 0 30px rgba(255,77,109,0.7);
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; color: #fff;
    transition: transform 0.2s ease;
  }
  .beacon-core:hover { transform: scale(1.08); }
  .beacon-core:focus { outline: 2px solid #fff; outline-offset: 4px; }
  .step-hint { font-size: 14px; color: #00d4ff; letter-spacing: 1px; }
  .step-hint .key {
    display: inline-block; padding: 2px 10px;
    border: 1px solid #00d4ff; border-radius: 4px;
    margin: 0 4px; font-family: 'Courier New', monospace;
  }
  .status-text { font-size: 16px; color: #ffd700; min-height: 22px; text-align: center; }
  .continue-btn { opacity: 0; pointer-events: none; transition: opacity 0.4s ease; margin-top: 6px; }
  .continue-btn.visible { opacity: 1; pointer-events: auto; }

  .stage-1 .beacon-core { pointer-events: none; opacity: 0.4; }
  .stage-2 .beacon-core { pointer-events: auto; opacity: 1; }
</style>
</head>
<body>
<div class="container">
  <div class="branded-panel stage-1" id="panel">
    <div class="title">Defence Console</div>
    <div class="subtitle">Threat detected. Enter Incident Mode to acknowledge the alert.</div>
    <div class="beacon-wrap" aria-live="polite">
      <div class="beacon-ring"></div>
      <div class="beacon-ring"></div>
      <div class="beacon-ring"></div>
      <div class="beacon-core" id="beacon" tabindex="0" role="button" aria-label="Intrusion beacon">!</div>
    </div>
    <div class="step-hint" id="hint">Press <span class="key">SPACE</span> to enter Incident Mode</div>
    <div class="status-text" id="status"></div>
    <button class="btn btn-success continue-btn" id="continueBtn">Continue</button>
  </div>
</div>
<script>
const panel = document.getElementById("panel");
const beacon = document.getElementById("beacon");
const hint = document.getElementById("hint");
const status = document.getElementById("status");
const continueBtn = document.getElementById("continueBtn");
let stage = 1; // 1=waiting for space, 2=waiting for click, 3=complete
let done = false;

function enterIncidentMode() {
  if (stage !== 1) return;
  stage = 2;
  panel.classList.remove("stage-1");
  panel.classList.add("stage-2");
  hint.innerHTML = 'Click the flashing beacon to open the first alert';
  beacon.focus();
}

function openAlert() {
  if (stage !== 2) return;
  stage = 3;
  status.textContent = "Alert acknowledged — Incident Mode active.";
  continueBtn.classList.add("visible");
  continueBtn.focus();
}

function complete() {
  if (done || stage !== 3) return;
  done = true;
  try { window.parent.postMessage({ type: "renjs-event", id: "intrusion-beacon-complete" }, "*"); } catch(e) {}
}

beacon.addEventListener("click", openAlert);
beacon.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openAlert(); }});
continueBtn.addEventListener("click", complete);
window.addEventListener("keydown", e => {
  if (e.key === " ") {
    e.preventDefault();
    if (stage === 1) enterIncidentMode();
    else if (stage === 3) complete();
  }
});
window.addEventListener("load", () => window.focus());
</script>
</body>
</html>
